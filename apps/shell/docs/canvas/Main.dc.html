<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing page, Android and Chrome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#14174a;text-decoration:none}a:hover{color:#14174a}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #eaf4ff; color: #14174a; font-family: system-ui, sans-serif">
  <div style="display: flex; justify-content: flex-end">

    </button>
  </div>
  <div style="height: 240px; border-radius: 28px; overflow: hidden; background: #fff0bf">
    <svg role="img" aria-label="A turtle on a green hill under the sun" viewBox="0 0 342 240" style="display: block; width: 342px; height: 240px">
      <circle cx="252" cy="80" r="46" style="fill: #ffc531"></circle>

      <rect x="106" y="149" width="12" height="11" rx="4" style="fill: #14174a"></rect>
      <circle cx="134" cy="143" r="9" style="fill: #14174a"></circle>
      <path d="M65 152 a30 25 0 0 1 60 0 z" style="fill: #14174a"></path>
      <path d="M78 150 a17 14 0 0 1 34 0" style="fill: none; stroke: #ffc531; stroke-width: 3; stroke-linecap: round"></path>
      <circle cx="137" cy="141" r="1.800" style="fill: #ffffff"></circle>
    </svg>
  </div>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{apps}}" as="app" hint-placeholder-count="12">
      <div style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 18px; background: {{app.bg}}">
        <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: none; stroke: #14174a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{ app.d }}"></path></svg>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: center">
    <div style="position: relative; width: 152px; height: 152px">
      <a href="Language.dc.html" aria-label="Install" style="display: flex; align-items: center; justify-content: center; width: 152px; height: 152px; border-radius: 999px; background: #ffe9a8">
        <span style="display: flex; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 999px; background: #ffc531">
          <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 56px; height: 56px; fill: none; stroke: #14174a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 4v11 M7 10.500l5 5 5-5 M5 20h14"></path></svg>

      <svg aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; right: -44px; bottom: -6px; width: 60px; height: 60px; fill: #ffffff; stroke: #14174a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none"><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.800 0-4.500-.860-5.990-2.340l-3.600-3.600a2 2 0 0 1 2.830-2.820L7 15V4a2 2 0 0 1 4 0v5.500V9a2 2 0 0 1 4 0v1a2 2 0 0 1 3 1z"></path></svg>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
