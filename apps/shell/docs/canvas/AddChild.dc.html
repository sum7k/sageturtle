<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a child</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14174a;text-decoration:none}a:hover{color:#14174a}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #eaf4ff; color: #14174a; font-family: 'Anek Latin', system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Profiles.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #ffffff">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: #14174a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button type="button" aria-label="Listen" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #ffffff">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: #14174a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 10v4h3l5 4V6L7 10H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
  </div>
  <div style="display: flex; justify-content: center">
    <div style="position: relative; width: 148px; height: 148px">
      <div style="display: flex; align-items: center; justify-content: center; width: 148px; height: 148px; border-radius: 999px; background: #fff0bf">
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 84px; height: 84px; fill: none; stroke: #14174a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.500 20a7.500 7.500 0 0 1 15 0"></path></svg>
      </div>
      <button type="button" aria-label="Take a picture" style="position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; padding: 0; border: 4px solid #eaf4ff; border-radius: 999px; background: #14174a">
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 16.500a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z"></path></svg>
      </button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="flex-grow: 1; display: flex; align-items: center; height: 64px; padding: 0 20px; border-radius: 999px; background: #ffffff; font-size: 20px; font-weight: 700">[Child's name]</div>
    <button type="button" aria-label="Say the child's name" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 64px; height: 64px; padding: 0; border: 0; border-radius: 999px; background: #ffc531">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 30px; height: 30px; fill: none; stroke: #14174a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M6 11a6 6 0 0 0 12 0 M12 17v4"></path></svg>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{ages}}" as="item" hint-placeholder-count="2">
      <button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" aria-label="{{ item.aria }}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 190px; padding: 16px 8px; border: 3px solid {{item.ring}}; border-radius: 24px; background: {{item.bg}}; color: #14174a">
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: {{item.size}}px; height: {{item.size}}px; fill: none; stroke: #14174a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M12 7a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5z M12 7v8 M7 10h10 M12 15l-3.500 7 M12 15l3.500 7"></path></svg>
        <span style="font-size: 24px; font-weight: 700">{{item.range}}</span>
        <sc-if value="{{ item.sel }}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; top: 10px; right: 10px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: #14174a">
            <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 17px; height: 17px; fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: center">
    <div style="position: relative; width: 84px; height: 84px">
      <a href="Profiles.dc.html" aria-label="Save with the owner's fingerprint" style="display: flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 999px; background: #ffc531">
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px; fill: none; stroke: #14174a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.500"></path></svg>
      </a>
      <span aria-hidden="true" style="position: absolute; right: -14px; bottom: -6px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 3px solid #eaf4ff; border-radius: 999px; background: #ffffff; pointer-events: none">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #14174a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M7 19c1-2 1.500-4.500 1.500-7a3.500 3.500 0 0 1 7 0c0 3-.5 5.500-1.500 8 M12 12c0 3-.5 5.500-1.700 8 M5 15.500c.3-1.200.5-2.300.5-3.500a6.500 6.500 0 0 1 11.500-4.200 M18.500 11.500c.1 2.500-.2 5-.9 7"></path></svg>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var picked = (this.state && this.state.picked) || 'kids';
var list = [['kids', '6–12', 'Kids, 6 to 12', 72, '#ddf3e4'], ['teens', '13–17', 'Teens, 13 to 17', 104, '#e9e4ff']];
return {
ages: list.map(function (a) {
var sel = a[0] === picked;
return { range: a[1], aria: a[2], size: a[3], bg: a[4], sel: sel, pressed: sel ? 'true' : 'false',
ring: sel ? '#14174a' : 'transparent', pick: function () { self.setState({ picked: a[0] }); } };
})
};
}
}
</script>
</body>
</html>
