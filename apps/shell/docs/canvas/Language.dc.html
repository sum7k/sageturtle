<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700&family=Anek+Devanagari:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14174a;text-decoration:none}a:hover{color:#14174a}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #eaf4ff; color: #14174a; font-family: 'Anek Latin', 'Anek Devanagari', system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #ffffff">
      <svg role="img" aria-label="This screen is speaking" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: #14174a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 10v4h3l5 4V6L7 10H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{langs}}" as="item" hint-placeholder-count="12">
      <button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 124px; padding: 8px; border: 3px solid {{item.ring}}; border-radius: 24px; background: {{item.bg}}; color: #14174a">
        <span style="font-size: 26px; line-height: 1.3; font-weight: 700">{{item.native}}</span>
        <sc-if value="{{ item.sel }}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; top: 8px; right: 8px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: #14174a">
            <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: center">
    <a href="Lock.dc.html" aria-label="Continue" style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 999px; background: #ffc531">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 36px; height: 36px; fill: none; stroke: #14174a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var picked = (this.state && this.state.picked) || 'hi';
var tints = ['#fff0bf', '#ffe3dc', '#ddf3e4', '#e9e4ff'];
var list = [
['hi', 'हिन्दी', 'Hindi'], ['en', 'English', 'English'], ['bn', 'বাংলা', 'Bengali'],
['mr', 'मराठी', 'Marathi'], ['te', 'తెలుగు', 'Telugu'], ['ta', 'தமிழ்', 'Tamil'],
['gu', 'ગુજરાતી', 'Gujarati'], ['ur', 'اردو', 'Urdu'], ['kn', 'ಕನ್ನಡ', 'Kannada'],
['or', 'ଓଡ଼ିଆ', 'Odia'], ['ml', 'മലയാളം', 'Malayalam'], ['pa', 'ਪੰਜਾਬੀ', 'Punjabi']
];
return {
langs: list.map(function (l, i) {
var sel = l[0] === picked;
return {
native: l[1], latin: l[2], sel: sel, pressed: sel ? 'true' : 'false',
bg: tints[i % 4], ring: sel ? '#14174a' : 'transparent',
pick: function () { self.setState({ picked: l[0] }); }
};
})
};
}
}
</script>
</body>
</html>
