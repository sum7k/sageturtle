<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What do you do</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14174a;text-decoration:none}a:hover{color:#14174a}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #eaf4ff; color: #14174a; font-family: 'Anek Latin', system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Pincode.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #ffffff">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: #14174a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button type="button" aria-label="Listen" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #ffffff; color: #14174a">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: #14174a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 10v4h3l5 4V6L7 10H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{kinds}}" as="item" hint-placeholder-count="9">
      <button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 148px; padding: 8px; border: 3px solid {{item.ring}}; border-radius: 24px; background: {{item.bg}}; color: #14174a">
        <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 999px; background: #ffffff">
          <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 36px; height: 36px; fill: none; stroke: #14174a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{ item.d }}"></path></svg>
        </span>
        <span style="font-size: 16px; line-height: 1.2; font-weight: 700; text-align: center">{{item.label}}</span>
        <sc-if value="{{ item.sel }}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; top: 8px; right: 8px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: #14174a">
            <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: center">
    <a href="Alerts.dc.html" aria-label="Continue" style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 999px; background: #ffc531">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 36px; height: 36px; fill: none; stroke: #14174a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var picked = (this.state && this.state.picked) || { farm: true, shop: true };
var tints = ['#fff0bf', '#ffe3dc', '#ddf3e4', '#e9e4ff'];
var list = [
['college', 'Student', 'M2 9l10-5 10 5-10 5-10-5z M6 11.500V16c2 2 10 2 12 0v-4.500 M22 9v5'],
['jobs', 'Looking for a job', 'M4 8h16v11H4z M9 8V5h6v3 M4 13h16'],
['office', 'Office job', 'M5 21V4h10v17 M15 9h4v12 M3 21h18 M8 8h1 M11 8h1 M8 12h1 M11 12h1 M8 16h1 M11 16h1'],
['shop', 'Shop or business', 'M4 10v10h16V10 M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z M9 20v-6h6v6'],
['gig', 'Daily work', 'M14 4l6 6-2 2-2-2-9 9-2-2 9-9-2-2 2-2z'],
['farm', 'Farming', 'M12 21v-9 M12 12c0-4-3-6-7-6 0 4 3 6 7 6z M12 15c0-3 2.500-5 6.500-5 0 3.500-2.500 5-6.500 5z'],
['home', 'Home', 'M4 11l8-7 8 7 M6 10v10h12V10 M10 20v-6h4v6'],
['teach', 'Teacher', 'M3 5h18v11H3z M8 20l4-4 4 4 M7 9h7 M7 12h4'],
['retired', 'Retired', 'M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z M16 10h2a2 2 0 0 1 0 5h-2 M8 3v3 M12 3v3']
];
return {
kinds: list.map(function (k, i) {
var sel = !!picked[k[0]];
return {
label: k[1], d: k[2], sel: sel, pressed: sel ? 'true' : 'false',
bg: tints[i % 4], ring: sel ? '#14174a' : 'transparent',
pick: function () { var next = Object.assign({}, picked); next[k[0]] = !next[k[0]]; self.setState({ picked: next }); }
};
})
};
}
}
</script>
</body>
</html>
